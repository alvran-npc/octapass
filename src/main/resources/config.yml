# Advanced OctaPass - core settings
startup-banner: true
timezone: Asia/Jakarta
language: id

storage:
  type: sqlite # sqlite | mysql | mariadb
  sqlite:
    file: octapass.db
  mysql:
    host: 127.0.0.1
    port: 3306
    database: octapass
    username: root
    password: ''
  pool:
    maximum-size: 5
    minimum-idle: 1
    connection-timeout-ms: 10000
    max-lifetime-ms: 1500000

autosave:
  interval-seconds: 60

quest-reset:
  daily-time: '00:00'
  weekly-start: MONDAY
  weekly-time: '00:00'
  daily-count: 3
  weekly-count: 3

quest-reroll:
  free-per-day: 1

premium-purchase:
  enabled: true
  provider: vault
  price: 250000

level-purchase:
  enabled: true
  provider: vault
  price-per-level: 50000
  max-per-transaction: 10

economy:
  # This build uses Vault's registered primary economy service.
  # ExcellentEconomy installations that expose Vault compatibility work through that provider.
  provider: vault

progress:
  actionbar: true
  bossbar: false
  update-interval-ticks: 20

anti-exploit:
  block-tracking: true
  ignore-player-placed-blocks: true
  chat-cooldown-ms: 1500
  command-cooldown-ms: 500
  placeholder-poll-ticks: 100

gui:
  animation:
    enabled: false
  resource-pack-mode: false
  decorative-border: true
