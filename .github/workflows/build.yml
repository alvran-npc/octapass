name: Build Advanced OctaPass

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: octapass-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build with Maven (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run tests
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: AdvancedOctaPass-${{ github.sha }}
          path: target/AdvancedOctaPass-*.jar
          if-no-files-found: error
          retention-days: 14
